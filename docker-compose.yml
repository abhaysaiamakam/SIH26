services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-railopt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railopt_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-railopt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - railopt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-railopt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-railopt}:${POSTGRES_PASSWORD:-railopt_dev_password}@postgres:5432/${POSTGRES_DB:-railopt}?schema=public
      API_PORT: ${API_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      PYTHON_BIN: python3
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./services:/app/services
      - ./data:/app/data
      - api_node_modules:/app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-4000}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - web_node_modules:/app/node_modules

volumes:
  railopt_pgdata:
  api_node_modules:
  web_node_modules:
